<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>my table</title>
    <style>
        table {
            border-collapse: collapse;
            width:60%;
        }
        th, td{
            border:1px solid;
            padding:8px;
            text-align:left;
        }
        th{
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<table>
    <tr>
        <th>NAME</th>
        <th>AGE</th>
        <th>CITY</th>
        <th>GENDER</th>   
    </tr>
    <tr>
        <td>Anjel</td>
        <td>22</td>
        <td>patna</td>
        <td>female</td>
    </tr>
    <tr>
        <td>Neha</td>
        <td>23</td>
        <td>vijayawada</td>
        <td>female</td>
    </tr>
    <tr>
        <td>yashwanth pakhana</td>
        <td>25</td>
        <td>hyderabad</td>
        <td>male</td>
    </tr>
    <tr>
        <td>Gayatri</td>
        <td>21</td>
        <td>tirupati</td>
        <td>female</td>
    </tr>
    
</body>
</html>
